[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "atlas-consultant"
version = "0.1.0"
description = "An open-source strategy consultant agent — hypothesis-driven, source-traceable, opinionated."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chris Reed Bates" },
]
requires-python = ">=3.10"
keywords = ["agent", "anthropic", "claude", "strategy", "consulting", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.70.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
perplexity = ["openai>=1.0"]
dev = [
    "build>=1.2.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
Homepage = "https://github.com/chrisreedbates/atlas"
Repository = "https://github.com/chrisreedbates/atlas"
Issues = "https://github.com/chrisreedbates/atlas/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
